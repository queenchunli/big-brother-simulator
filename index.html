<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuPaul's Drag Race: Ultimate 10-Ep RPG</title>
    <style>
        :root {
            --primary: #ff007f;
            --secondary: #7928ca;
            --accent: #00f2fe;
            --dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --panel-bg: #242424;
            --light: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            border: 2px solid var(--primary);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 4px 0;
            font-size: 20px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .form-group { margin-bottom: 10px; }
        label {
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
            color: #ff75bc;
            font-size: 12px;
        }
        input, select {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        button.action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }
        .queen-hud {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background: var(--panel-bg);
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 10px;
            border: 1px solid #444;
            text-align: center;
        }
        .hud-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hud-item span {
            color: var(--primary);
            font-weight: bold;
            display: block;
        }
        .log-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .log-entry {
            margin-bottom: 6px;
            border-bottom: 1px solid #222;
            padding-bottom: 3px;
        }
        .highlight {
            color: var(--accent);
            font-weight: bold;
        }
        .choice-btn {
            background: #282828;
            border: 1px solid var(--secondary);
            margin-bottom: 6px;
            text-align: left;
            padding: 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            width: 100%;
            box-sizing: border-box;
        }
        .choice-btn:hover { background: var(--secondary); }
        .look-card {
            background: #222;
            border: 1px dashed var(--accent);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Create Screen -->
        <div id="screen-create" class="screen active">
            <h1>RuPaul's Drag Race</h1>
            <div class="subtitle">10-Episode Deep Career RPG Simulator</div>
            <div class="form-group">
                <label for="dragName">Drag Name:</label>
                <input type="text" id="dragName" value="Crystal Lubrikant">
            </div>
            <div class="form-group">
                <label for="dragStyle">Primary Archetype:</label>
                <select id="dragStyle">
                    <option value="Chaos">Alternative / Weirdo / Chaos</option>
                    <option value="Comedy">Comedy / Camp Queen</option>
                    <option value="Fashion">Fashion / High-Couture Queen</option>
                    <option value="Assassin">Lip-Sync Assassin</option>
                    <option value="Pageant">Pageant / Glamour Diva</option>
                </select>
            </div>
            <div class="form-group">
                <label for="catchphrase">Signature Entrance Catchphrase:</label>
                <input type="text" id="catchphrase" value="Let loose and let God!">
            </div>
            <button class="action-btn" onclick="startSimulator()">Enter the Werkroom (Ep 1)</button>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen">
            <div class="queen-hud">
                <div class="hud-item">QUEEN<span id="hudName">Crystal</span></div>
                <div class="hud-item">EPISODE<span id="hudEp">1 / 10</span></div>
                <div class="hud-item">WINS<span id="hudWins">0</span></div>
                <div class="hud-item">FAME<span id="hudFame">50%</span></div>
            </div>

            <h1 id="stageTitle" style="font-size: 16px; margin-bottom: 2px;">Episode 1: The Werkroom</h1>
            <div class="subtitle" id="stageSub" style="margin-bottom: 8px;">Let the games begin</div>

            <div id="lookCard" class="look-card" style="display:none;"></div>
            <div id="logBox" class="log-box"></div>
            <div id="choicesContainer"></div>
        </div>
    </div>

    <script>
        const episodes = [
            { ep: 1, title: "The Werkroom & Sewing Challenge", type: "sewing", desc: "Design a signature red-carpet gown from unconventional materials." },
            { ep: 2, title: "Girl Groups: Pop Star Bang", type: "performance", desc: "Record vocals and choreograph a high-energy pop anthem." },
            { ep: 3, title: "The Snatch Game Extravaganza", type: "comedy", desc: "Impersonate a celebrity icon on the panel with quick-witted humor." },
            { ep: 4, title: "Design Ball: Three Looks in One", type: "sewing", desc: "Present executive realness, swimsuit, and an avant-garde ball gown." },
            { ep: 5, title: "The Comedy Roast of RuPaul", type: "comedy", desc: "Deliver brutal, hilarious jokes roasting the judges and fellow queens." },
            { ep: 6, title: "Acting Challenge: Sci-Fi Parody", type: "acting", desc: "Star in an over-the-top campy movie trailer." },
            { ep: 7, title: "The Makeover Challenge", type: "makeover", desc: "Transform rugged athletes into drag sisters." },
            { ep: 8, title: "Musical: The Ru-Demption", type: "performance", desc: "Sing live and dance in a Broadway-style musical spectacle." },
            { ep: 9, title: "The Final Four Stand-Up Roast", type: "comedy", desc: "Solo stand-up comedy set to secure a spot in the Grand Finale." },
            { ep: 10, title: "The Grand Finale Music Video & Crowning", type: "finale", desc: "Choreograph a solo performance and battle for the crown." }
        ];

        let gameState = {
            player: { name: "", style: "", catchphrase: "", wins: 0, fame: 50 },
            currentEpIndex: 0,
            phase: 'werkroom',
            competitorsLeft: 10,
            bottomTwo: false
        };

        function startSimulator() {
            gameState.player.name = document.getElementById('dragName').value.trim() || "Crystal Lubrikant";
            gameState.player.style = document.getElementById('dragStyle').value;
            gameState.player.catchphrase = document.getElementById('catchphrase').value.trim() || "Let loose!";

            document.getElementById('screen-create').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');

            updateHUD();
            addLog(`🚪 The workroom door opens! You walk in shouting: <span class="highlight">"${gameState.player.catchphrase}"</span> 💅`);
            addLog(`✨ 9 fierce competitors are already inside sizing you up. Let's make history across 10 epic episodes!`);
            setupWerkroomPhase();
        }

        function updateHUD() {
            document.getElementById('hudName').innerText = gameState.player.name;
            document.getElementById('hudEp').innerText = `${gameState.currentEpIndex + 1} / 10`;
            document.getElementById('hudWins').innerText = gameState.player.wins;
            document.getElementById('hudFame').innerText = `${gameState.player.fame}%`;
        }

        function addLog(text) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div class="log-entry">${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function setupWerkroomPhase() {
            gameState.phase = 'werkroom';
            updateHUD();
            let epObj = episodes[gameState.currentEpIndex];
            document.getElementById('stageTitle').innerText = `Ep ${epObj.ep}: ${epObj.title}`;
            document.getElementById('stageSub').innerText = "Werkroom Strategy Phase";
            document.getElementById('lookCard').style.display = 'none';

            addLog(`📢 RuPaul announces: <b>${epObj.desc}</b>`);

            document.getElementById('choicesContainer').innerHTML = `
                <button class="choice-btn" onclick="makeWerkroomChoice('alliance')">🤝 Form a strategic alliance with top contenders</button>
                <button class="choice-btn" onclick="makeWerkroomChoice('focus')">🛠️ Isolate yourself and master every single detail</button>
                <button class="choice-btn" onclick="makeWerkroomChoice('drama')">💋 Stir up heavy workroom drama and throw shade</button>
            `;
        }

        function makeWerkroomChoice(choice) {
            if (choice === 'alliance') {
                gameState.player.fame += 5;
                addLog(`You form a tight alliance! Your confidence and social standing rise.`);
            } else if (choice === 'focus') {
                gameState.player.fame += 10;
                addLog(`Pure dedication! Your preparation gives you a major edge for the challenge.`);
            } else {
                gameState.player.fame -= 5;
                addLog(`Ooh girl! You started messy drama. All eyes are on you in the workroom!`);
            }
            setupChallengePhase();
        }

        function setupChallengePhase() {
            gameState.phase = 'challenge';
            updateHUD();
            let epObj = episodes[gameState.currentEpIndex];
            document.getElementById('stageSub').innerText = "Maxi-Challenge Approach";

            document.getElementById('choicesContainer').innerHTML = `
                <button class="choice-btn" onclick="resolveChallenge('bold')">🔥 Take a massive, high-risk creative gamble</button>
                <button class="choice-btn" onclick="resolveChallenge('safe')">⚖️ Play it smart, polished, and calculated</button>
                <button class="choice-btn" onclick="resolveChallenge('camp')">🤪 Lean fully into chaotic camp, humor & heart</button>
            `;
        }

        function resolveChallenge(tactic) {
            let epObj = episodes[gameState.currentEpIndex];
            let roll = Math.random();
            let successThreshold = 0.35;
            if (gameState.player.style.toLowerCase().includes(tactic)) successThreshold = 0.2;

            let won = roll > successThreshold;
            let inBottom = !won && roll < 0.25;

            let lookDesc = `✨ <b>Runway (${epObj.title}):</b> A breathtaking ${gameState.player.style} presentation styled with ${tactic} flair and immaculate details!`;
            let card = document.getElementById('lookCard');
            card.style.display = 'block';
            card.innerHTML = lookDesc;
            addLog(lookDesc);

            if (gameState.currentEpIndex === 9) {
                triggerGrandFinale();
                return;
            }

            if (won) {
                gameState.player.wins++;
                gameState.player.fame += 15;
                addLog(`🏆 <b>AMAZING! You WIN the Maxi-Challenge this week!</b> 🎉`);
                setupUntucked(false);
            } else if (inBottom) {
                gameState.bottomTwo = true;
                gameState.player.fame -= 10;
                addLog(`⚠️ <b>Uh oh... You landed in the BOTTOM TWO!</b> Lip-sync for your life in Untucked!`);
                setupUntucked(true);
            } else {
                gameState.player.fame += 2;
                addLog(`👍 Solid safe performance. You live to drag another day!`);
                advanceEpisode();
            }
        }

        function setupUntucked(isBottom) {
            gameState.phase = 'untucked';
            updateHUD();
            document.getElementById('stageSub').innerText = isBottom ? "Untucked: Lip-Sync Battle!" : "Untucked: Safe Celebration";

            let container = document.getElementById('choicesContainer');
            if (isBottom) {
                container.innerHTML = `
                    <button class="choice-btn" onclick="resolveLipSync('stunts')">🤸‍♀️ Unleash high-energy stunts, splits, and death drops</button>
                    <button class="choice-btn" onclick="resolveLipSync('emotional')">💧 Pour your raw soul out with intense emotional eye contact</button>
                    <button class="choice-btn" onclick="resolveLipSync('comedy')">🤡 Go completely goofy and hilarious with comedic props</button>
                `;
            } else {
                container.innerHTML = `
                    <button class="choice-btn" onclick="advanceEpisode()">🥂 Toast with the sisters in Untucked and move to next week</button>
                `;
            }
        }

        function resolveLipSync(tactic) {
            addLog(`🎶 The music hits! You deliver a fierce, passionate ${tactic} lip-sync performance!`);
            let survived = Math.random() > 0.28;

            if (survived) {
                addLog(`👑 RuPaul smiles: <span class="highlight">"${gameState.player.name}, shantay you stay!"</span> You survived elimination!`);
                advanceEpisode();
            } else {
                addLog(`💔 RuPaul sighs: "${gameState.player.name}, sashay away." You have been eliminated in Episode ${gameState.currentEpIndex + 1}.`);
                document.getElementById('stageTitle').innerText = "ELIMINATED";
                document.getElementById('stageSub').innerText = `Finished in top ${gameState.competitorsLeft}!`;
                document.getElementById('lookCard').style.display = 'none';
                document.getElementById('choicesContainer').innerHTML = `<button class="choice-btn" onclick="location.reload()">🔄 Play Again / New Season</button>`;
            }
        }

        function advanceEpisode() {
            gameState.currentEpIndex++;
            gameState.competitorsLeft = Math.max(2, 10 - gameState.currentEpIndex);
            if (gameState.currentEpIndex >= 10) {
                triggerGrandFinale();
            } else {
                setupWerkroomPhase();
            }
        }

        function triggerGrandFinale() {
            document.getElementById('stageTitle').innerText = "👑 GRAND FINALE: THE CROWNING 👑";
            document.getElementById('stageSub').innerText = "America's Next Drag Superstar";
            document.getElementById('lookCard').style.display = 'none';

            addLog(`👑 <span class="highlight">RuPaul proudly announces: "The winner of Season 10, with ${gameState.player.wins} challenge wins and unstoppable star power... ${gameState.player.name}!"</span> 🎉✨🏆`);
            document.getElementById('choicesContainer').innerHTML = `
                <button class="choice-btn" onclick="location.reload()">🌟 Start All-Stars Season</button>
            `;
        }
    </script>
</body>
</html>
