<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuPaul's Drag Race: Mobile RPG</title>
    <style>
        :root {
            --primary: #ff007f;
            --secondary: #7928ca;
            --accent: #00f2fe;
            --dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --panel-bg: #242424;
            --light: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
            border: 2px solid var(--primary);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 4px 0;
            font-size: 20px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            color: #ff75bc;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        button.action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        .queen-hud {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: var(--panel-bg);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 11px;
            border: 1px solid #444;
            text-align: center;
        }
        .hud-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hud-item span {
            color: var(--primary);
            font-weight: bold;
            display: block;
        }
        .log-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .log-entry {
            margin-bottom: 6px;
            border-bottom: 1px solid #222;
            padding-bottom: 3px;
        }
        .highlight {
            color: var(--accent);
            font-weight: bold;
        }
        .choice-btn {
            background: #282828;
            border: 1px solid var(--secondary);
            margin-bottom: 8px;
            text-align: left;
            padding: 12px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            width: 100%;
            box-sizing: border-box;
        }
        .choice-btn:hover {
            background: var(--secondary);
        }
        .look-card {
            background: #222;
            border: 1px dashed var(--accent);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Screen 1 -->
        <div id="screen-create" class="screen active">
            <h1>RuPaul's Drag Race</h1>
            <div class="subtitle">Mobile RPG Simulator</div>
            <div class="form-group">
                <label for="dragName">Drag Name:</label>
                <input type="text" id="dragName" value="Crystal Lubrikant">
            </div>
            <div class="form-group">
                <label for="dragStyle">Archetype:</label>
                <select id="dragStyle">
                    <option value="Chaos">Alternative / Chaos</option>
                    <option value="Comedy">Comedy Queen</option>
                    <option value="Fashion">Fashion / Look Queen</option>
                    <option value="Assassin">Lip-Sync Assassin</option>
                    <option value="Pageant">Pageant Queen</option>
                </select>
            </div>
            <div class="form-group">
                <label for="catchphrase">Catchphrase:</label>
                <input type="text" id="catchphrase" value="Let loose!">
            </div>
            <button class="action-btn" onclick="startSimulation()">Enter Werkroom</button>
        </div>

        <!-- Screen 2 -->
        <div id="screen-game" class="screen">
            <div class="queen-hud">
                <div class="hud-item">QUEEN<span id="hudName">Crystal</span></div>
                <div class="hud-item">EPISODE<span id="hudEp">1</span></div>
                <div class="hud-item">PHASE<span id="hudPhase">Werkroom</span></div>
            </div>

            <h1 id="stageTitle" style="font-size: 17px; margin-bottom: 2px;">Episode 1: Werkroom</h1>
            <div class="subtitle" id="stageSub" style="margin-bottom: 10px;">Make your strategic choices</div>

            <div id="lookCard" class="look-card" style="display:none;"></div>
            <div id="logBox" class="log-box"></div>
            <div id="choicesContainer"></div>
        </div>
    </div>

    <script>
        let gameState = {
            player: { name: "", style: "", catchphrase: "", wins: 0 },
            episode: 1,
            phase: 'werkroom',
            bottomTwo: []
        };

        function startSimulation() {
            const name = document.getElementById('dragName').value.trim() || "Crystal Lubrikant";
            const style = document.getElementById('dragStyle').value;
            const catchphrase = document.getElementById('catchphrase').value.trim() || "Let loose!";

            gameState.player = { name, style, catchphrase, wins: 0 };

            document.getElementById('screen-create').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            
            updateHUD();
            addLog(`RuPaul welcomes everyone! You shout: <span class="highlight">"${catchphrase}"</span> 💅`);
            setupWerkroomPhase();
        }

        function updateHUD() {
            document.getElementById('hudName').innerText = gameState.player.name;
            document.getElementById('hudEp').innerText = gameState.episode;
            document.getElementById('hudPhase').innerText = gameState.phase.toUpperCase();
        }

        function addLog(text) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div class="log-entry">${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function setupWerkroomPhase() {
            gameState.phase = 'werkroom';
            updateHUD();
            document.getElementById('stageTitle').innerText = `Ep ${gameState.episode}: Werkroom`;
            document.getElementById('stageSub').innerText = "Choose your pre-challenge strategy:";
            document.getElementById('lookCard').style.display = 'none';

            document.getElementById('choicesContainer').innerHTML = `
                <button class="choice-btn" onclick="werkroomChoice(1)">💬 Form alliance & kiki with Bob</button>
                <button class="choice-btn" onclick="werkroomChoice(2)">✂️ Focus 100% on sewing your runway garment</button>
                <button class="choice-btn" onclick="werkroomChoice(3)">🎭 Spy on rival stations and throw shade</button>
            `;
        }

        function werkroomChoice(choice) {
            if (choice === 1) addLog(`You bond with Bob over strategy, building a strong alliance!`);
            else if (choice === 2) addLog(`You spend every second perfecting your garment seams.`);
            else addLog(`You throw cheeky shade across the room. Tensions rise!`);
            setupChallengeChoice();
        }

        function setupChallengeChoice() {
            gameState.phase = 'challenge';
            updateHUD();
            document.getElementById('stageTitle').innerText = `Ep ${gameState.episode}: Maxi-Challenge`;
            document.getElementById('stageSub').innerText = "Choose your performance approach:";

            const challenges = ["The Comedy Roast", "Avant-Garde Recycled Couture", "Snatch Game"];
            let currentChallenge = challenges[(gameState.episode - 1) % challenges.length];
            addLog(`RuPaul announces: <span class="highlight">${currentChallenge}</span>!`);

            document.getElementById('choicesContainer').innerHTML = `
                <button class="choice-btn" onclick="resolveChallenge('bold')">🔥 Take a massive creative risk</button>
                <button class="choice-btn" onclick="resolveChallenge('safe')">⚖️ Play it smart, polished, and calculated</button>
                <button class="choice-btn" onclick="resolveChallenge('funny')">🤪 Lean entirely into absurd camp and comedy</button>
            `;
        }

        function resolveChallenge(tactic) {
            let roll = Math.random();
            let won = (tactic === 'bold' && roll > 0.3) || (tactic === 'safe' && roll > 0.5) || (tactic === 'funny' && roll > 0.4);
            let inBottom = !won && roll < 0.3;

            let lookDesc = `✨ <b>Runway:</b> A stunning ${gameState.player.style} look with ${tactic} flair!`;
            let card = document.getElementById('lookCard');
            card.style.display = 'block';
            card.innerHTML = lookDesc;
            addLog(lookDesc);

            if (won) {
                gameState.player.wins++;
                addLog(`🏆 <b>You win the Maxi-Challenge!</b> 🎉`);
                setupUntucked(false);
            } else if (inBottom) {
                gameState.bottomTwo = [gameState.player.name, "Plane Jane"];
                addLog(`⚠️ <b>Bottom Two with Plane Jane! Lip-sync time!</b>`);
                setupUntucked(true);
            } else {
                addLog(`👍 Safe performance. Advancing.`);
                gameState.episode++;
                if (gameState.episode > 3) triggerFinale();
                else setupWerkroomPhase();
            }
        }

        function setupUntucked(isBottom) {
            gameState.phase = 'untucked';
            updateHUD();
            document.getElementById('stageTitle').innerText = isBottom ? "Backstage: Lip-Sync!" : "Backstage: Untucked";
            document.getElementById('stageSub').innerText = isBottom ? "Fight for your life!" : "Celebrate your safety:";

            const container = document.getElementById('choicesContainer');
            if (isBottom) {
                container.innerHTML = `
                    <button class="choice-btn" onclick="resolveLipSync('stunts')">🤸‍♀️ Unleash high-energy stunts & death drops</button>
                    <button class="choice-btn" onclick="resolveLipSync('emotional')">💧 Focus on deep emotional storytelling</button>
                    <button class="choice-btn" onclick="resolveLipSync('comedy')">🤡 Lean into goofy, campy choreography</button>
                `;
            } else {
                container.innerHTML = `
                    <button class="choice-btn" onclick="advanceSafe()">🥂 Toast with the queens & prep for next week</button>
                `;
            }
        }

        function advanceSafe() {
            gameState.episode++;
            if (gameState.episode > 3) triggerFinale();
            else setupWerkroomPhase();
        }

        function resolveLipSync(style) {
            addLog(`🎶 Lip-sync performance: ${style}!`);
            let survived = Math.random() > 0.25;

            if (survived) {
                addLog(`👑 RuPaul: "${gameState.player.name}, shantay you stay!"`);
                gameState.episode++;
                if (gameState.episode > 3) triggerFinale();
                else setupWerkroomPhase();
            } else {
                addLog(`💔 RuPaul: "${gameState.player.name}, sashay away." Eliminated.`);
                document.getElementById('stageTitle').innerText = "ELIMINATED";
                document.getElementById('stageSub').innerText = "Better luck next season!";
                document.getElementById('choicesContainer').innerHTML = `<button class="choice-btn" onclick="location.reload()">🔄 Play Again</button>`;
            }
        }

        function triggerFinale() {
            document.getElementById('stageTitle').innerText = "👑 GRAND FINALE 👑";
            document.getElementById('stageSub').innerText = "The crown is yours!";
            document.getElementById('lookCard').style.display = 'none';
            addLog(`👑 <span class="highlight">RuPaul crowns ${gameState.player.name} America's Next Drag Superstar!</span> 🎉✨`);
            document.getElementById('choicesContainer').innerHTML = `<button class="choice-btn" onclick="location.reload()">🔄 Start New Season</button>`;
        }
    </script>
</body>
</html>
